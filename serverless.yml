org: mylocalhome
app: meet-agent-ai-node-back
service: meet-agent-ia-node-back
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  deploymentBucket:
    name: meetai-deployment-${opt:stage, 'dev'}
  stage: ${opt:stage, 'dev'}

  environment:
    USERS_TABLE: ${self:service}-${sls:stage}-user
    MEETS_TABLE: ${self:service}-${sls:stage}-meet
    JWT_SECRET: ${env:JWT_SECRET}
    BUCKET_NAME: meetingsai-bucket

  iam:
    role:
      statements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:Scan
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:BatchWriteItem
          - s3:*
          - s3:PutObject
          - ssm:PutParameter
          - ssm:GetParameter
          - ssm:DeleteParameter
        Resource:
          - Fn::GetAtt: [UsersTable, Arn]
          - Fn::GetAtt: [MeetsTable, Arn]
          - arn:aws:s3:::meetingsai-bucket/*
          - '*'

functions:
  verify-token: 
    handler: src/users/verifyToken.handler

  getUsers:
    handler: src/users/getUsers.handler
    events:
      - http:
          path: /users
          method: get
          authorizer:
            name: verify-token
            type: TOKEN
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 0 

  getUserId:
    handler: src/users/getUser.handler
    events:
      - http:
          path: /users/{id}
          method: get
          authorizer:
            name: verify-token
            type: TOKEN
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 0

  createUser:
    handler: src/users/createUser.handler
    events:
      - http:
          path: /users
          method: post
          authorizer:
            name: verify-token
            type: TOKEN
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 0
  UpdateUser:
    handler: src/users/updateUser.handler
    events:
      - http:
          path: /users/{id}
          method: put
          authorizer:
            name: verify-token
            type: TOKEN
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 0

  DeleteUser:
    handler: src/users/deleteUser.handler
    events:
      - http:
          path: /users/{id}
          method: delete
          authorizer:
            name: verify-token
            type: TOKEN
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 0

  Login:
    handler: src/users/login.handler
    events:
      - http:
          path: /users/login
          method: post

  getMeets:
    handler: src/meets/getMeets.handler
    events:
      - http:
          path: /meets
          method: get
          authorizer:
              name: verify-token
              type: TOKEN
              identitySource: method.request.header.Authorization
              resultTtlInSeconds: 0
  getMeet:
    handler: src/meets/getMeet.handler
    events:
      - http:
          path: /meets/{id}
          method: get
          authorizer:
            name: verify-token
            type: TOKEN
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 0

  CreateMeet:
    handler: src/meets/createMeet.handler
    events:
      - http:
          path: /meet
          method: post
          authorizer:
            name: verify-token
            type: TOKEN
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 0

  UpdateMeet:
    handler: src/meets/updateMeet.handler
    events:
      - http:
          path: /meets/{id}
          method: put
          authorizer:
            name: verify-token
            type: TOKEN
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 0

  DeleteMeet:
    handler: src/meets/deleteMeet.handler
    events:
      - http:
          path: /meets/{id}
          method: delete
          authorizer:
            name: verify-token
            type: TOKEN
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 0

resources:
  Resources:
    MeetingsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: meetingsai-bucket
        VersioningConfiguration:
          Status: Enabled
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
    UsersTable:
      Type: 'AWS::DynamoDB::Table'
      Properties:
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
        TableName: '${self:provider.environment.USERS_TABLE}'
    MeetsTable:
      Type: 'AWS::DynamoDB::Table'
      Properties:
        TableName: '${self:provider.environment.MEETS_TABLE}'
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
       


  

useDotenv: true
plugins:
 - serverless-offline

build:
 esbuild:
  bundle: true
  sourcemap: true
  target: node18
  platform: node
